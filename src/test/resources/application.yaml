spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/filmoteka
          jwk-set-uri: http://localhost:8180/realms/filmoteka/protocol/openid-connect/certs
          audiences:
            - filmoteka-api

  kafka:
    admin:
      auto-create: false
    consumer:
      group-id: filmoteka-user-test
    listener:
      auto-startup: false

logging:
  level:
    root: WARN

app:
  clients:
    catalog:
      base-url: http://localhost:8080/api/v1

  cors:
    allowed-origins: http://localhost:5173

  kafka:
    retry-delay: 50ms
    topics:
      film-deleted:
        name: film-deleted-test

  reconciliation:
    enabled: false
