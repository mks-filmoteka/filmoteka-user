server:
  port: 8082

spring:
  application:
    name: filmoteka-user

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: filmoteka
    baseline-on-migrate: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: filmoteka
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI}
          jwk-set-uri: ${AUTH_JWK_SET_URI}
          audiences:
            - ${AUTH_AUDIENCE}

  kafka:
    admin:
      operation-timeout: 5s
      close-timeout: 2s
    properties:
      "[reconnect.backoff.ms]": 1000
      "[reconnect.backoff.max.ms]": 10000
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_USER_CONSUMER_GROUP_ID}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET}

app:
  clients:
    catalog:
      base-url: ${CATALOG_API_URL}
      connect-timeout: ${CATALOG_CONNECT_TIMEOUT:2s}
      read-timeout: ${CATALOG_READ_TIMEOUT:5s}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  kafka:
    retry-delay: 1s
    topics:
      film-deleted:
        name: ${KAFKA_FILM_DELETED_TOPIC}

  reconciliation:
    enabled: true

logging:
  level:
    root: INFO
    io.github.mksfilmoteka.user: DEBUG
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

management:
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,metrics
